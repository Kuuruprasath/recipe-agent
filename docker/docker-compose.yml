version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: recipe-agent-db
    restart: always
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen123
      POSTGRES_DB: recipeagent
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
